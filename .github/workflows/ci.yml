name: Verify print notice regression

on:
  push:
    branches: [verify/print-notice-2014]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 16.20.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run regression against unchanged production code
        run: npm run test -- --watch=false --progress=false --browsers=FirefoxHeadless --include=src/app/mailviewer/singlemailviewer.component.spec.ts
