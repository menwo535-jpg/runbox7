name: Verify print E2E on Ubuntu 22.04

on:
  push:
    branches: [verify/print-notice-2014]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 16.20.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run unchanged end-to-end suite with the print fix
        run: npm run ci-tests -- e2e
